[package]
name = "pixel_learn"
version = "1.0.0"
edition = "2024"
description = "Pixel Learn - learn to code in a pixel-art RPG"
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "pixel_learn"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
