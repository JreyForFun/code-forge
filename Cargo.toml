[package]
name = "code_forge"
version = "1.6.0"
edition = "2024"
description = "Code Forge - learn to code in a pixel-art RPG"
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "code_forge"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rodio = { version = "0.19", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
