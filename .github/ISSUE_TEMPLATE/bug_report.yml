name: Bug report
description: Something in Code Forge is broken or behaves wrongly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please search the existing issues first.
        **Security problems:** don't post them here; follow [SECURITY.md](https://github.com/JreyForFun/code-forge/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Tell us what you saw. A screenshot or short video helps a lot.
      placeholder: When I press CHECK on the third step of "CSS Selectors", the game freezes.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      placeholder: |
        1. Open the CSS course
        2. Start lesson "Selectors"
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Device
      options:
        - Windows (laptop / desktop)
        - Android phone
        - Android tablet
        - Chromebook / emulator
        - Built from source (other)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Code Forge version
      description: Shown at the bottom of Settings, for example "CODE FORGE v1.0.0".
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows or Android version, and phone model
      placeholder: Windows 11 / Android 14 on a Samsung Galaxy A54
  - type: textarea
    id: crash
    attributes:
      label: Crash log (Windows)
      description: If the game closed by itself, paste the contents of `%APPDATA%\code_forge\crash.log` if it exists.
      render: text
